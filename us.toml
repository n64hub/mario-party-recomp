# N64Recomp's configuration for Mario Party (USA), SHA-1 1159bd56730094bfc71be30113e1cfc8bacf34f3: it reads the game's
# code out of the ROM by the symbols tools/gen_syms.sh dumps from the decomp's ELF, and writes RecompiledFuncs/
# (tools/recompile.sh). The code is stored raw in the ROM: main after the boot code, and each of the 131 overlays
# (minigames, boards, menus) where marioparty.yaml has it, so there is nothing to decompress first.
[input]
# The decomp's entrypoint (asm/entrypoint.s), the ROM header's.
entrypoint = 0x80000400
# Paths are relative to this file.
symbols_file_path = "syms/marioparty.us.syms.toml"
rom_file_path = "roms/marioparty.us.z64"
output_func_path = "RecompiledFuncs"
use_absolute_symbols = true

[patches]
# Functions recompiled as empty ones.
stubs = [
    # libleo's boot of a 64DD disk game, which the game links in and reaches only with a 64DD attached, which the
    # runtime never reports: it writes to its stack at an offset N64Recomp can't analyze.
    "__LeoBootGame2",
]
# Functions written as <name>_recomp: their names are a system library's too (PlaySound is Windows' winmm's).
renamed = [
    "PlaySound",
]

# The survey (patches/survey.c): the overlay a script asked for, in place of the one the game goes to.
[[patches.hook]]
func = "omOvlGotoEx"
before_vram = 0x8005E044
text = "{ void mp_survey_goto(uint8_t*, gpr*, gpr*, gpr*); mp_survey_goto(rdram, &ctx->r4, &ctx->r5, &ctx->r6); }"

# The scissor pfDrawFonts sets for the text it draws, and leaves set for what is drawn after it, reaches row 339 of a
# 240-line picture: (0, 0, 319, 340) in place of (0, 0, 319, 240). A board's objects that the camera has at the
# picture's bottom then draw past it, which on a console writes a few pixels into the next framebuffer's top rows,
# under the overscan border, but in RT64 makes the frame as tall as the scissor: RT64 copies whole rows of it to RAM,
# over the top of the next framebuffer, takes that one's RAM as changed and draws it from RAM, so at a turn's end an
# old frame flashed up at 4:3 with black at its sides. Each of the function's two scissors is the whole screen's
# instead, (0, 0, 320, 240): it stops at the picture's bottom, and at 320, not 319, since RT64 draws a rectangle of the
# whole screen out to the window's edges only while it is as wide as every scissor in its framebuffer, and moves a
# rectangle's right edge onto its scissor's a pixel from it. The next frame's clear (func_80025658's fill rectangle of
# the background's colour), under the text's 319, stayed inside 4:3, so the window's sides were never cleared and kept
# what earlier frames left there: Bobsled Run's views, whose sky is the clear's dark blue, had flat white past 4:3's
# sides, and Bowl Over's and Desert Dash's views, kept at 4:3, a still picture beside them.
[[patches.hook]]
func = "pfDrawFonts"
before_vram = 0x800625BC
text = "ctx->r2 = 0x005003C0;"

[[patches.hook]]
func = "pfDrawFonts"
before_vram = 0x80062B84
text = "ctx->r2 = 0x005003C0;"

# The board's HUD at the picture's sides (lib/mario-party-engine/src/hud.cpp says how): the players' panels' places
# and groups (src/54120.c's func_80054758(player, x, y) sets a panel's place; the board's status, 0x800D83A8, 0x40
# bytes a player, has the panel's group at 6 and the place the board moves it by at 0xC, two floats, and the sprite
# groups' addresses are at 0x800EE330), the groups killed (the sprite manager's HuSprGrpKill, func_80064D38(group),
# and its init, func_80064B70, which forgets them all) and each sprite drawn (func_80068410(gfx, sprite), every path
# out of it through 0x80069358 with gfx in s5).
[[patches.hook]]
func = "func_80054758"
before_vram = 0x80054758
text = "{ void mp_hud_panel_at(uint8_t*, int32_t, gpr, int32_t, int32_t, gpr); int32_t p = (int32_t)ctx->r4; gpr s = (gpr)(int32_t)0x800D83A8 + p * 0x40; int16_t g = MEM_H(6, s); mp_hud_panel_at(rdram, p, (gpr)(int32_t)MEM_W(g * 4, (gpr)(int32_t)0x800EE330), 0xC, (int16_t)ctx->r5, s + 0xC); }"

[[patches.hook]]
func = "func_80064D38"
before_vram = 0x80064D38
text = "{ void mp_hud_group_killed(uint8_t*, gpr); mp_hud_group_killed(rdram, (gpr)(int32_t)MEM_W((int16_t)ctx->r4 * 4, (gpr)(int32_t)0x800EE330)); }"

[[patches.hook]]
func = "func_80064B70"
before_vram = 0x80064B70
text = "{ void mp_hud_reset(uint8_t*); mp_hud_reset(rdram); }"

[[patches.hook]]
func = "func_80068410"
before_vram = 0x80068410
text = "{ void mp_hud_sprite_start(uint8_t*, gpr, gpr); mp_hud_sprite_start(rdram, ctx->r4, ctx->r5); }"

[[patches.hook]]
func = "func_80068410"
before_vram = 0x80069358
text = "{ void mp_hud_sprite_end(uint8_t*, gpr); mp_hud_sprite_end(rdram, ctx->r21); }"

# A screen wipe past 4:3 (lib/mario-party-engine/src/wipe.cpp says how): the wipe module's whole-screen rectangle
# (func_800728F4(gfx, alpha), out through 0x800729C0), and a shape wipe (func_8007420C, with gfx in t0): its draws
# (from 0x80074250, past its whole-screen rectangle for a closed shape, to its end at 0x80074C14) and its rectangles
# around its square (from 0x80074A9C, where it has set their colour, with the square's left and right edges in t3 and
# t4).
[[patches.hook]]
func = "func_800728F4"
before_vram = 0x800728F4
text = "{ void mp_wipe_fill_start(uint8_t*, gpr); mp_wipe_fill_start(rdram, ctx->r4); }"

[[patches.hook]]
func = "func_800728F4"
before_vram = 0x800729C0
text = "{ void mp_wipe_fill_end(uint8_t*, gpr); mp_wipe_fill_end(rdram, ctx->r4); }"

[[patches.hook]]
func = "func_8007420C"
before_vram = 0x80074250
text = "{ void mp_wipe_shape_start(uint8_t*, gpr); mp_wipe_shape_start(rdram, ctx->r8); }"

[[patches.hook]]
func = "func_8007420C"
before_vram = 0x80074A9C
text = "{ void mp_wipe_square_sides(uint8_t*, gpr, gpr, gpr); mp_wipe_square_sides(rdram, ctx->r8, ctx->r11, ctx->r12); }"

[[patches.hook]]
func = "func_8007420C"
before_vram = 0x80074C14
text = "{ void mp_wipe_shape_end(uint8_t*, gpr); mp_wipe_shape_end(rdram, ctx->r8); }"

# A 4:3 picture's sides black (lib/mario-party-engine/src/wipe.cpp, mp_wipe_picture_sides): func_800247FC ends the
# frame's last display list after its wipe and its text (pfDrawFonts, which returns the list's next command in v0),
# with its gDPFullSync.
[[patches.hook]]
func = "func_800247FC"
before_vram = 0x80025350
text = "{ gpr mp_wipe_picture_sides(uint8_t*, gpr); ctx->r2 = mp_wipe_picture_sides(rdram, ctx->r2); }"

# A minigame's instructions screen past 4:3 (patches/instructions.c says how): after its setup has placed and scaled
# each of the two strips of cloud along the bottom (form 0xB000A, then 0xB000B, each in s0), a copy of it on each side.
[[patches.hook]]
func = "func_800F6B14_MinigameInstructions"
before_vram = 0x800F6DFC
text = "{ void instructions_clouds_beside(uint8_t*, recomp_context*); ctx->r4 = ctx->r16; ctx->r5 = 0xB000A; instructions_clouds_beside(rdram, ctx); }"

[[patches.hook]]
func = "func_800F6B14_MinigameInstructions"
before_vram = 0x800F6E84
text = "{ void instructions_clouds_beside(uint8_t*, recomp_context*); ctx->r4 = ctx->r16; ctx->r5 = 0xB000B; instructions_clouds_beside(rdram, ctx); }"
