# Board Select's TV static at the size it has every other frame from the frame it shows (n64hub/mario-party-recomp#179).
# On a board change, func_800FD804_AdventureModeSetup sets the static (the TV object's model[1]) to the object's own
# scale, (0.45, 0.5, 0.45), shows it and sleeps 10 frames; the object's frame function, func_800FE68C, sets it to
# 1.1 times the x scale, 0.495 each way, from the next frame on. For that one frame the static sits inside the TV's
# dark plate, which hides the board's picture with no static in front of it. Once the game has set it (s1 is the
# object: its models' indexes at the pointer at 0x40, its x scale at 0x30), this sets it again as the frame function
# does.
