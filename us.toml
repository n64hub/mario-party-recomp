# func_80101748_CoinBlockBash draws its table of them (0x38 bytes each, from the word at 0x80103298), its slot in s3 and
# its entry in s1, its place at 0x20: each slot's gSPMatrix at s0 from 0x801019B4, its display list at s2 after it, then
