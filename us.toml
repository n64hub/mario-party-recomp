# A 3D model's parts paired with their own between the game's frames (lib/mario-party-engine/src/model_ids.cpp says
# how). func_800247FC walks the models for each camera (s3), s1 the slot of the one whose parts func_8002C1A8(data, ...)
# queues (from 0x80025148, its data in a0). func_8002D2CC queues a part of the model in s1, its part number in s3, at
# its place s2 of the queue of its layer s4, from 0x8002D5A4: the queue is a queue a layer, D_800ED0D8's 8, each as
# long as the u8 at 0x800C3500 has for it, so a part's place in all of them is its place in its layer's after all of
# the layers before it. func_8002D614 draws the queues: each part's gSPMatrix from 0x8002DA50, at s1, the list's next
# command (0x800F37DC) already past it, with the part's entry (s0, of 0x5C bytes from its layer's queue, at s2, the
# layer in s3) and its matrix (at 0x44), then its display list through func_8002CDEC, back at 0x8002DA80. The frame's
# number is at 0x800F3848, and its display list starts at 0x800F37E0, 0x800F50BA commands long.
[[patches.hook]]
