text = "{ void mp_model_queued(uint8_t*, int32_t, int32_t, gpr); int32_t place = (int16_t)ctx->r18; for (int32_t layer = 0; layer < (int32_t)(uint8_t)ctx->r20; layer++) place += MEM_BU(layer, (gpr)(int32_t)0x800C3500); mp_model_queued(rdram, place, (int16_t)ctx->r19, ctx->r17); }"

