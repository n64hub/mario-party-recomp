text = "{ void mp_hud_sprite_width(uint8_t*, float); void mp_hud_sprite_start(uint8_t*, gpr, gpr); gpr s = ctx->r5; gpr data = (gpr)(int32_t)MEM_W(0x4C, s); if (data != 0) { gpr frame = (gpr)(int32_t)MEM_W(0x0, data) + MEM_H(0x52, s) * 12; union { uint32_t u; float f; } scale; scale.u = (uint32_t)MEM_W(0x14, s); mp_hud_sprite_width(rdram, MEM_HU(0x4, frame) * scale.f); } mp_hud_sprite_start(rdram, ctx->r4, ctx->r5); void mp_hud_sprite_reach(uint8_t*, gpr, gpr, int32_t); union { uint32_t u; float f; } turn; turn.u = (uint32_t)MEM_W(0x1C, s); uint32_t attr = (uint32_t)MEM_W(0x20, s); mp_hud_sprite_reach(rdram, ctx->r4, s + 4, (turn.f == 0.0f) && ((attr & 0xC0000) == 0) && ((attr & 0x30000) != 0x30000)); }"

