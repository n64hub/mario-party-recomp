text = "{ gpr mp_model_push(uint8_t*, gpr, int32_t, gpr, int32_t, gpr, int32_t); int32_t place = (int32_t)(ctx->r16 - (gpr)(int32_t)MEM_W(0, ctx->r18)) / 0x5C; for (int32_t layer = 0; layer < (int16_t)ctx->r19; layer++) place += MEM_BU(layer, (gpr)(int32_t)0x800C3500); ctx->r17 = mp_model_push(rdram, ctx->r17, place, (gpr)(int32_t)MEM_W(0x44, ctx->r16), (int32_t)MEM_W(0, (gpr)(int32_t)0x800F3848), (gpr)(int32_t)MEM_W(0, (gpr)(int32_t)0x800F37E0), MEM_HU(0, (gpr)(int32_t)0x800F50BA) * 8); MEM_W(0, (gpr)(int32_t)0x800F37DC) = (int32_t)(ctx->r17 + 8); }"

